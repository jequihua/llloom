[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llloom"
version = "0.1.0"
description = "llloom: source-grounded knowledge compiler with wiki views"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
openai = [
    "openai>=1.50.0",
]
anthropic = [
    "anthropic>=0.40.0",
]
mcp = [
    "mcp>=1.0.0",
]
structured = [
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-go>=0.21",
    "tree-sitter-rust>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-c-sharp>=0.21",
    "tree-sitter-java>=0.21",
]
docling = [
    "docling>=2.0",
]

[project.scripts]
llloom = "llloom.cli:main"
llloom-mcp = "llloom.mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
